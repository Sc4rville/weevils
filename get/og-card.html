<!doctype html>
<!-- weevils' share card (og.png, 1200×630): the page's colors and logo. Render: a headless browser screenshot of this
     file at 1200×630, scale 1 (it reads the logo from public/branding/). -->
<html lang="en"><head><meta charset="utf-8"><style>
  :root { --a: oklch(0.80 0.14 297.5); --b: oklch(0.80 0.14 162.5); --c: oklch(0.80 0.14 72.5); --d: oklch(0.80 0.14 230); --e: oklch(0.80 0.14 27.5); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--a); color: #000; font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .brand { position: absolute; left: 76px; top: 58px; display: flex; align-items: center; gap: 18px; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
  .brand img { width: 92px; height: 92px; }
  h1 { position: absolute; left: 72px; top: 190px; margin: 0; font-size: 104px; line-height: 0.96; font-weight: 800; letter-spacing: -0.05em; }
  p { position: absolute; left: 76px; top: 424px; margin: 0; font-size: 33px; line-height: 1.25; font-weight: 600; color: rgb(0 0 0 / 0.78); }
  .bands { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; }
  .bands i { flex: 1; }
  .url { position: absolute; right: 76px; top: 72px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; border: 4px solid #000; border-radius: 99px; padding: 10px 26px; }
</style></head><body>
  <div class="brand"><img src="../public/branding/weevboss.svg" alt="">weevils</div>
  <div class="url">tryweevils.scarville.tech</div>
  <h1>your AI dev team,<br>in your pocket.</h1>
  <p>Claude Code and Codex on your own server, driven from your phone.</p>
  <div class="bands"><i style="background: var(--b)"></i><i style="background: var(--c)"></i><i style="background: var(--d)"></i><i style="background: var(--e)"></i></div>
</body></html>
