    bad_secret: 'The password is missing (or the key doesn’t look right).', bad_user: 'This user name isn’t valid.', bad_port: 'This port isn’t valid.',
    no_job: 'This setup expired: start again.', network: 'No network: try again.',
  },
}
document.documentElement.lang = FR ? 'fr' : 'en'
for (const el of document.querySelectorAll('[data-t]')) el.textContent = W[el.dataset.t]
const langBtn = document.getElementById('lang')
langBtn.textContent = FR ? 'EN' : 'FR'
langBtn.setAttribute('aria-label', FR ? 'English' : 'Français')
langBtn.onclick = () => { try { localStorage.setItem('wvlang', FR ? 'en' : 'fr') } catch {} location.reload() }

// ------------------------------------------------------------------ device
const ua = navigator.userAgent
const phone = /iPhone|iPod|Android.+Mobile|Mobile.+Firefox|Windows Phone/i.test(ua) || (/iPad|Android/i.test(ua) && matchMedia('(pointer: coarse)').matches) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
const os = phone ? 'phone' : /Windows/.test(ua) ? 'windows' : /Macintosh|Mac OS X/.test(ua) ? 'mac' : /Linux|X11|CrOS/.test(ua) ? 'linux' : 'other'
// A computer weevils installs on: the command is offered right on the first screen.
const computer = os === 'linux' || os === 'windows' || os === 'mac'

// ------------------------------------------------------------------ tiny DOM
const app = document.getElementById('app')
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v)
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k))
  return el
}
const band = (cls, ...kids) => h('section', { class: `band ${cls}` }, h('div', { class: 'wrap' }, ...kids))
const show = (...sections) => { document.body.classList.toggle('deep', show.deep); show.deep = true; app.replaceChildren(...sections); scrollTo({ top: 0 }) }
const errBox = () => h('div', { class: 'err', hidden: true, role: 'alert' })
let HOSTNAME = 'Hetzner'
const showErr = (box, code) => { box.textContent = (W.e[code] || W.e[code?.replace?.(/^http_\d+$/, 'host_down')] || code || W.e.network).replace(/\{host\}/g, HOSTNAME); box.hidden = false }
// Where to put a new server: near the person, from the browser's region.
const REGION = (() => { const r = (/-([A-Z]{2})\b/.exec(navigator.language || '') || [])[1] || ''; return /^(US|CA|MX|BR|AR|CL|CO|PE)$/.test(r) ? 'america' : /^(SG|IN|JP|KR|ID|MY|TH|VN|PH|HK|TW|AU|NZ)$/.test(r) ? 'asia' : 'europe' })()
const back = () => h('button', { class: 'back', onclick: home }, W.back)

// ------------------------------------------------------------------ API
// The preview key (until launch), from the link: kept for this browser and sent with every call (no cookie needed).
const GK = (() => {
  const k = new URLSearchParams(location.search).get('k') || (/[#&]k=([^&]+)/.exec(location.hash) || [])[1]
  try { if (k) localStorage.setItem('wvgk', k); return k || localStorage.getItem('wvgk') || '' } catch { return k || '' }
})()
async function api(p, body) {
  let r
  try {
    r = await fetch(p, { method: 'POST', headers: { 'content-type': 'application/json', ...(GK && { 'x-get-key': GK }) }, body: JSON.stringify(body) })
  } catch { throw new Error('network') }
  const data = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(data.error || `http_${r.status}`)
  return data
}

// The page's key pair: the install encrypts your login link with the public half; only this browser can open it.
async function newJob(kind) {
  const pair = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['encrypt', 'decrypt'])
  const spki = new Uint8Array(await crypto.subtle.exportKey('spki', pair.publicKey))
  const pub = btoa(String.fromCharCode(...spki))
  const j = await api('/api/job', { kind, lang: FR ? 'fr' : 'en', pub })
  const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey)
  const saved = { sid: j.sid, view: j.view, kind, jwk, command: j.command, at: Date.now() }
  localStorage.setItem('wvget', JSON.stringify(saved))
  return saved
}
const markStarted = (job) => { job.started = true; localStorage.setItem('wvget', JSON.stringify(job)) }
const savedJob = () => { try { const s = JSON.parse(localStorage.getItem('wvget') || 'null'); return s && Date.now() - s.at < 3 * 3600e3 ? s : null } catch { return null } }
async function unseal(job, sealed) {
  const key = await crypto.subtle.importKey('jwk', job.jwk, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt'])
  const bytes = Uint8Array.from(atob(sealed), (c) => c.charCodeAt(0))
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, key, bytes))
}

// ------------------------------------------------------------------ screens
function choiceBtn(cls, title, sub, onclick, tag) {
  return h('button', { class: `choice ${cls}`, onclick }, h('div', { class: 'wrap' }, h('div', {}, h('b', {}, title, tag ? h('em', { class: 'tag' }, tag) : null), h('span', {}, sub)), h('div', { class: 'go' }, '→')))
}

function home() {
  show.deep = false
  const intro = band('b5', h('h2', {}, W.plug), h('p', { class: 'small' }, W.plugSub))
  const hz = [choiceBtn('b1', W.hs, W.hsSub, () => provider('hostinger'), W.rec), choiceBtn('b4', W.hz, W.hzSub, () => provider('hetzner'))]
  const vps = choiceBtn('b2', W.vps, W.vpsSub, ssh)
  if (computer) {
    // A computer: connect it right here, and still suggest a VPS.
    const note = os === 'windows' ? W.winNote : os === 'mac' ? W.macNote : ''
    const cmdBand = band('b3', h('h2', {}, W.thisPc), h('p', {}, W.thisPcSub), note ? h('p', { class: 'small' }, note) : null, pcBox(true))
    return show(cmdBand, band('b5', h('h2', {}, W.better), h('p', { class: 'small' }, W.betterSub)), ...hz, vps)
  }
  show(intro, ...hz, vps, choiceBtn('b3', W.pc, W.pcSub, pc))
}

// --- (a) a server created for you: Hostinger or Hetzner, same flow
const money = (v, cur) => new Intl.NumberFormat(FR ? 'fr-FR' : 'en-IE', { style: 'currency', currency: cur || 'EUR' }).format(v)
function provider(kind) {
  HOSTNAME = kind === 'hostinger' ? 'Hostinger' : 'Hetzner'
  let job, token = '', size = 'recommended', sizes = []
  const err = errBox()
  const tok = h('input', { type: 'password', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '••••••••••••••••', 'aria-label': W.token })
  const pick = h('div', { class: 'sizes', hidden: true })
  const note = h('p', { class: 'small' })
  const createBtn = h('button', { class: 'btn', hidden: true }, W.create)
  const priceBtn = h('button', { class: 'btn light' }, W.seePrice)
  const price = (z) => money(z.monthly, z.currency)
  // Billed by the hour (Hetzner): the real hourly price, and the monthly one as its cap.
  const hourly = (z) => z.hourly > 0 && new Intl.NumberFormat(FR ? 'fr-FR' : 'en-IE', { style: 'currency', currency: z.currency || 'EUR', minimumFractionDigits: 3, maximumFractionDigits: 4 }).format(z.hourly)
  const label = (z) => hourly(z) ? W.hourly(hourly(z), price(z)) : z.first && z.first !== z.monthly ? W.firstMonth(money(z.first, z.currency), price(z)) : `${price(z)}${W.perMonth}`
  const draw = () => {
    pick.replaceChildren(...sizes.map((z) => h('button', { class: `size${z.size === size ? ' on' : ''}`, type: 'button', onclick: () => { size = z.size; draw() } },
      h('b', {}, W[`size_${z.size}`]),
      h('span', {}, `${z.memory} ${W.gb} · ${W.agents(z.agents)}`),
      h('strong', {}, label(z)))))
    const z = sizes.find((x) => x.size === size) || sizes[0]
    if (z) createBtn.textContent = hourly(z) ? W.createHourly : W.createFor(z.first && z.first !== z.monthly ? W.firstOnly(money(z.first, z.currency)) : `${price(z)}${W.perMonth}`)
  }
  priceBtn.onclick = async () => {
    err.hidden = true
    token = tok.value.trim()
    priceBtn.disabled = true
    try {
      job ||= await newJob(kind)
      const q = await api(`/api/${kind}/quote`, { sid: job.sid, view: job.view, token, region: REGION })
      if (!q.payment) throw new Error('no_payment')
      sizes = q.sizes
      if (!sizes.some((z) => z.size === size)) size = sizes[0].size
      draw()
      const billed = W[`billed_${kind}`]
      note.textContent = [typeof billed === 'function' ? billed(sizes.some((z) => z.ipv4)) : billed, q.paymentLabel ? W.payWith(q.paymentLabel) : ''].join(' ')
      pick.hidden = false
      createBtn.hidden = false
      priceBtn.hidden = true
    } catch (e) { showErr(err, e.message) } finally { priceBtn.disabled = false }
  }
  createBtn.onclick = async () => {
    err.hidden = true
    createBtn.disabled = true
    try {
      await api(`/api/${kind}/create`, { sid: job.sid, view: job.view, token, size, region: REGION })
      token = ''
      tok.value = ''
      markStarted(job)
      progress(job)
    } catch (e) { showErr(err, e.message); createBtn.disabled = false }
  }
  tok.oninput = () => { pick.hidden = true; createBtn.hidden = true; priceBtn.hidden = false }
  const steps = kind === 'hostinger'
    ? [h('li', {}, W.hs1, h('a', { class: 'btn light', href: 'https://hpanel.hostinger.com/billing/payment-methods', target: '_blank', rel: 'noopener' }, W.hs1b)),
       h('li', {}, W.hs2, h('a', { class: 'btn light', href: 'https://hpanel.hostinger.com/profile/api', target: '_blank', rel: 'noopener' }, W.hs2b))]
    : [h('li', {}, W.hz1, h('a', { class: 'btn light', href: 'https://accounts.hetzner.com/signUp', target: '_blank', rel: 'noopener' }, W.hz1b)),
       h('li', {}, W.hz2, h('a', { class: 'btn light', href: 'https://console.hetzner.cloud/projects', target: '_blank', rel: 'noopener' }, W.hz2b))]
  show(band(kind === 'hostinger' ? 'b1' : 'b4', back(), h('h2', {}, kind === 'hostinger' ? W.hsTitle : W.hzTitle),
    h('ol', { class: 'how' }, ...steps, h('li', {}, W.hz3, h('label', {}, W.token), tok, priceBtn, pick, note, createBtn)),
    err))
}

// --- (b) your VPS
function ssh() {
  let job
  const err = errBox()
  const host = h('input', { inputmode: 'decimal', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '203.0.113.7' })
  const user = h('input', { value: 'root', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' })
  const port = h('input', { value: '22', inputmode: 'numeric' })
  const pw = h('input', { type: 'password', autocomplete: 'off' })
  const key = h('textarea', { placeholder: '-----BEGIN OPENSSH PRIVATE KEY-----', autocapitalize: 'off', spellcheck: 'false' })
  const pwBlock = h('div', {}, h('label', {}, W.pw), pw)
  const keyBlock = h('div', { hidden: true }, h('label', {}, W.key), key)
  const toggle = h('button', { class: 'link', type: 'button' }, W.useKey)
  toggle.onclick = () => { const k = keyBlock.hidden; keyBlock.hidden = !k; pwBlock.hidden = k; toggle.textContent = k ? W.usePw : W.useKey }
  const go = h('button', { class: 'btn' }, W.install)
  go.onclick = async () => {
    err.hidden = true
    go.disabled = true
    try {
      job ||= await newJob('ssh')
      const body = { sid: job.sid, view: job.view, host: host.value.trim(), user: user.value.trim() || 'root', port: Number(port.value) || 22 }
      if (keyBlock.hidden) body.password = pw.value
      else body.key = key.value
      await api('/api/ssh', body)
      pw.value = ''
      key.value = ''
      markStarted(job)
      progress(job)
    } catch (e) { showErr(err, e.message); go.disabled = false }
  }
  show(band('b2', back(), h('h2', {}, W.vpsTitle), h('p', {}, W.vpsIntro),
    h('label', {}, W.host), host,
    h('div', { class: 'row' }, h('div', {}, h('label', {}, W.user), user), h('div', { style: 'width:96px' }, h('label', {}, W.port), port)),
    pwBlock, keyBlock, toggle, go, err),
  band('b5', h('p', { class: 'small' }, W.noVps), h('button', { class: 'btn light', onclick: () => provider('hostinger') }, W.hs), h('button', { class: 'btn light', onclick: () => provider('hetzner') }, W.hz)))
}

// --- (c) a computer
function pcBox(here) {
  const err = errBox()
  const code = h('code', {}, '…')
  const copyBtn = h('button', { type: 'button' }, W.copy)
  const box = h('div', {}, h('div', { class: 'cmd' }, code, copyBtn), err)
  let job
  ;(async () => {
    try {
      const s = savedJob()
      job = s && s.kind === 'pc' ? s : await newJob('pc')
      code.textContent = job.command
      watch(job, () => progress(job))
    } catch (e) { showErr(err, e.message) }
  })()
  copyBtn.onclick = async () => {
    if (!job) return
    try { await navigator.clipboard.writeText(job.command) } catch { getSelection().selectAllChildren(code) }
    copyBtn.textContent = W.copied
    setTimeout(() => (copyBtn.textContent = W.copy), 1600)
  }
  if (!here && navigator.share) box.append(h('button', { class: 'btn light', onclick: () => job && navigator.share({ text: job.command }).catch(() => {}) }, W.share))
  box.append(h('p', { class: 'note' }, W.pcWait), h('p', { class: 'note' }, W.pcLimit))
  return box
}
function pc() {
  show(band('b3', back(), h('h2', {}, W.pcTitle), h('p', {}, W.pcIntro), pcBox(false)))
}

// ------------------------------------------------------------------ progress, then your weevils
const ORDER = ['created', 'start', 's_system', 's_source', 's_build', 's_service', 'https', 'done']
const FOLD = { s_config: 's_source', waiting: 's_service', s_https: 'https', tunnel: 'https' }
let watching = 0
/** Polls the job; calls onMove when the install starts (the PC command was run), onState on every answer. */
function watch(job, onMove, onState) {
  const me = ++watching
  let moved = false
  const tick = async () => {
    if (me !== watching) return
    try {
      const s = await api('/api/status', { sid: job.sid, view: job.view })
      if (s.state !== 'waiting' && !moved && onMove) { moved = true; return onMove(s) }
      onState?.(s)
      if (s.state === 'done' || s.state === 'failed') return
    } catch (e) {
      if (e.message === 'no_job') { localStorage.removeItem('wvget'); return onState?.({ state: 'failed', error: W.e.no_job }) }
    }
    setTimeout(tick, 2000)
  }
  tick()
}

function progress(job) {
  const labels = ORDER.map((k) => k === 'created' ? W[`s_created_${job.kind === 'hostinger' ? 'hetzner' : job.kind}`] : k === 'https' ? (job.kind === 'pc' ? W.s_tunnel : W.s_https) : W[`s_${k.replace(/^s_/, '')}`])
  const items = ORDER.map((k, i) => h('li', {}, h('i', {}, ''), labels[i]))
  const bar = h('div', {}, '')
  const err = errBox()
  const started = Date.now()
  const clock = h('p', { class: 'small' }, '')
  show(band('b5', h('h2', {}, W.progTitle), h('div', { class: 'bar' }, bar), h('ul', { class: 'steps' }, items), clock, h('p', { class: 'note' }, W.progNote), err))
  const timer = setInterval(() => { const s = Math.round((Date.now() - started) / 1000); clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }, 1000)
  watch(job, null, async (s) => {
    const seen = new Set(s.steps.map((k) => FOLD[k] || k))
    let last = -1
    ORDER.forEach((k, i) => { if (seen.has(k)) last = i })
    // A reported step has started; 'created' is reported once finished.
    const now = ORDER[last] === 'created' || last < 0 ? last + 1 : last
    items.forEach((li, i) => { li.className = i < now || s.state === 'done' ? 'done' : i === now && s.state !== 'failed' ? 'now' : ''; li.firstChild.textContent = li.className === 'done' ? '✓' : '' })
    bar.style.width = `${Math.max(4, Math.round((now / (ORDER.length - 1)) * 100))}%`
    if (s.state === 'failed') {
      clearInterval(timer)
      localStorage.removeItem('wvget')
      err.replaceChildren(h('b', {}, W.failTitle), h('br'), s.error || '', h('br'), h('button', { class: 'btn light', onclick: home }, W.retry))
      err.hidden = false
    }
    if (s.state === 'done') { clearInterval(timer); ready(job, s) }
  })
}

async function ready(job, s) {
  let link = ''
  if (s.result?.sealed) {
    try { link = await unseal(job, s.result.sealed) } catch {}
  }
  // Only a link to the address the install reported, on that exact origin.
  if (!link || !s.result.url || !link.startsWith(s.result.url + '/#k=')) link = ''
  localStorage.removeItem('wvget')
  const target = link || s.result?.url || ''
  const sec = [h('h2', {}, W.doneTitle)]
  if (!link) sec.push(h('p', { class: 'small' }, W.noSeal))
  if (phone) {
    sec.push(h('p', {}, W.home), h('a', { class: 'btn', href: target }, W.open))
    show(band('b1', ...sec))
    if (link) { sec[0].textContent = W.donePhone; setTimeout(() => location.replace(link), 4000) }
    return
  }
  if (link && window.qrcode) {
    const q = qrcode(0, 'M')
    q.addData(link)
    q.make()
    sec.push(h('p', {}, W.scan), Object.assign(h('div', { class: 'qr' }), { innerHTML: q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) }), h('p', { class: 'note' }, W.scanNote))
  }
  sec.push(h('p', { class: 'small' }, W.home), h('a', { class: 'btn light', href: target }, W.openHere))
  show(band('b1', ...sec))
}

// ------------------------------------------------------------------ start (or resume a setup in progress)
const resume = savedJob()
if (resume && resume.kind !== 'pc' && resume.started) progress(resume)
else if (resume && resume.kind === 'pc') { home(); if (!computer) pc() }
else home()
</script>
